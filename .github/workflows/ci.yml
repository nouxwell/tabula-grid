name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # package.json claims Node 22.13+, 24 and 26+. The maintainer's machine runs one of them; this
  # matrix is what makes the other two more than a claim. The Nuxt example is built, type-checked
  # and tested with the rest: its test starts the built server and reads the page it renders.
  checks:
    name: Build, types, tests — Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      # Every version reports. Whether a break is specific to one version or common to all is the
      # first thing worth knowing, and stopping at the first failure hides it.
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]

    steps:
      - uses: actions/checkout@v7

      # Takes the pnpm version from "packageManager" in package.json, so it is stated once.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Type check
        run: pnpm -r typecheck

      - name: Tests
        run: pnpm -r test

  # The grid driven in a real browser: keyboard, mouse, clipboard, widths. Chromium is downloaded
  # here; on a developer's machine the tests use the Edge that is already installed.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter playground exec playwright-core install --with-deps chromium

      - name: Browser tests
        run: pnpm --filter playground test:browser

  # The packages as they would be published: packed, installed from the tarballs into an empty
  # project, imported in Node and type-checked against as Vite and as Node resolve modules. The
  # tests above run the sources; this is what someone installing from npm gets.
  packages:
    name: Packages as published
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm --filter "./packages/**" build

      - name: Pack, install and use
        run: pnpm check:packages

  # Lint and formatting read the same source on every Node version, so they run once.
  static:
    name: Lint and formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check
